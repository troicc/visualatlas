[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visualatlas"
version = "0.0.1"
description = "Draw arrow-pushing mechanisms for fast human checking, and flag formally invalid steps."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "rdkit>=2023.9",
    "numpy>=1.24",
    "scipy>=1.10",
    "fonttools>=4.40",
    "jsonschema>=4.17",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
visualatlas = "visualatlas.cli:main"
visualatlas-demo = "visualatlas.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running (run with: pytest -m slow)"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E701", "E702", "E731", "E741"]
